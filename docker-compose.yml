services:
  livekit:
    image: livekit/livekit-server:latest
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "50000-60000:50000-60000/udp"
    restart: unless-stopped

  token_server:
    build:
      context: ./token_server
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL_PUBLIC: ${LIVEKIT_URL_PUBLIC:-ws://localhost:7880}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      - livekit
    ports:
      - "${TOKEN_SERVER_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - token_server
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    environment:
      TOKEN_SERVER_URL: ${TOKEN_SERVER_INTERNAL_URL:-http://token_server:8000/token}
      LIVEKIT_URL_INTERNAL: ${LIVEKIT_URL_INTERNAL:-ws://livekit:7880}
      AGENT_ROOM: ${AGENT_ROOM:-demo-room}
      AGENT_IDENTITY: ${AGENT_IDENTITY:-agent-001}
      AGENT_NAME: ${AGENT_NAME:-Room Agent}
      AGENT_READY_TOPIC: ${AGENT_READY_TOPIC:-presence}
      TOKEN_REQUEST_TIMEOUT: ${TOKEN_REQUEST_TIMEOUT:-10}
      AGENT_DATA_DIR: /app/data
      TOOL_GRAPH_PATH: ${TOOL_GRAPH_PATH:-/app/voice_agent_graph_v0_1/tool_graph.json}
    depends_on:
      - livekit
      - token_server
    volumes:
      - ./data:/app/data:ro
      - ./voice_agent_graph_v0_1:/app/voice_agent_graph_v0_1:ro
    restart: unless-stopped
