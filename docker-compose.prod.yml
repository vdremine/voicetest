services:
  caddy:
    image: caddy:2.9-alpine
    network_mode: host
    restart: unless-stopped
    depends_on:
      - frontend
      - livekit
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        keys:
          "${LIVEKIT_API_KEY:-voice-agent-prod}": "${LIVEKIT_API_SECRET:-replace-with-long-random-secret}"

  token_server:
    build:
      context: ./token_server
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
    command: uvicorn main:app --host 127.0.0.1 --port 8000
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-voice-agent-prod}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-long-random-secret}
      LIVEKIT_URL_PUBLIC: ${LIVEKIT_URL_PUBLIC:-wss://livekit.vdremin.ru}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

  frontend:
    image: nginx:1.27-alpine
    network_mode: host
    restart: unless-stopped
    depends_on:
      - token_server
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/nginx.conf:ro

  agent:
    build:
      context: ./agent
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
      - token_server
    environment:
      TOKEN_SERVER_URL: http://127.0.0.1:8000/token
      LIVEKIT_URL_INTERNAL: ws://127.0.0.1:7880
      AGENT_ROOM: ${AGENT_ROOM:-demo-room}
      AGENT_IDENTITY: ${AGENT_IDENTITY:-agent-001}
      AGENT_NAME: ${AGENT_NAME:-Room Agent}
      AGENT_READY_TOPIC: ${AGENT_READY_TOPIC:-presence}
      TOKEN_REQUEST_TIMEOUT: ${TOKEN_REQUEST_TIMEOUT:-10}
      CONNECT_RETRY_DELAY: ${CONNECT_RETRY_DELAY:-2}
      AGENT_EVENTS_TOPIC: ${AGENT_EVENTS_TOPIC:-agent_events}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-16000}
      AUDIO_NUM_CHANNELS: ${AUDIO_NUM_CHANNELS:-1}
      AUDIO_FRAME_SIZE_MS: ${AUDIO_FRAME_SIZE_MS:-20}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.45}
      VAD_MIN_SPEECH_DURATION_MS: ${VAD_MIN_SPEECH_DURATION_MS:-200}
      VAD_MIN_SILENCE_DURATION_MS: ${VAD_MIN_SILENCE_DURATION_MS:-500}
      VAD_SPEECH_PAD_MS: ${VAD_SPEECH_PAD_MS:-120}
      VAD_USE_ONNX: ${VAD_USE_ONNX:-false}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      STT_ENABLED: ${STT_ENABLED:-true}
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      STT_DEVICE: ${STT_DEVICE:-auto}
      STT_COMPUTE_TYPE_CPU: ${STT_COMPUTE_TYPE_CPU:-int8}
      STT_COMPUTE_TYPE_GPU: ${STT_COMPUTE_TYPE_GPU:-float16}
      STT_LANGUAGE: ${STT_LANGUAGE:-ru}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-1}
      STT_CONFIDENCE_FLOOR: ${STT_CONFIDENCE_FLOOR:-0.35}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.2}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      TTS_ENABLED: ${TTS_ENABLED:-true}
      TTS_MODEL_PATH: ${TTS_MODEL_PATH:-/models/silero-tts/ru/v5_4_ru.pt}
      TTS_MODEL_URL: ${TTS_MODEL_URL:-https://models.silero.ai/models/tts/ru/v5_4_ru.pt}
      TTS_SPEAKER: ${TTS_SPEAKER:-xenia}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-24000}
      TTS_PUBLISH_SAMPLE_RATE: ${TTS_PUBLISH_SAMPLE_RATE:-24000}
      TTS_FRAME_MS: ${TTS_FRAME_MS:-20}
      UTTERANCE_DIR: /tmp/voice-agent/utterances
      SESSION_LOG_DIR: /tmp/voice-agent/session-logs
      HF_HOME: /models/.cache/huggingface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${MODEL_CACHE_DIR:-/opt/models}:/models
      - ${VOICE_AGENT_DATA_DIR:-/opt/voice-agent-data}:/tmp/voice-agent

volumes:
  caddy_data:
  caddy_config:
