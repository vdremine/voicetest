services:
  llm:
    image: vllm/vllm-openai:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${LLM_MODEL:-Qwen/Qwen3-8B}
      - --host
      - 127.0.0.1
      - --port
      - ${LLM_PORT:-8001}
      - --api-key
      - ${LLM_API_KEY:-local-token}
      - --dtype
      - auto
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --max-model-len
      - ${LLM_MAX_MODEL_LEN:-32768}
    volumes:
      - ${MODEL_CACHE_DIR:-/opt/models}/huggingface:/root/.cache/huggingface

  agent:
    gpus: all
    depends_on:
      - llm
    environment:
      STT_DEVICE: cuda
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-medium}
      STT_COMPUTE_TYPE_GPU: ${STT_COMPUTE_TYPE_GPU:-float16}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-3}
      STT_CONFIDENCE_FLOOR: ${STT_CONFIDENCE_FLOOR:-0.25}
      DEBUG_SAVE_WAV: ${DEBUG_SAVE_WAV:-false}
