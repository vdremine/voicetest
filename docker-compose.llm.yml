services:
  llm:
    image: vllm/vllm-openai:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - 127.0.0.1
      - --port
      - ${LLM_PORT:-8010}
      - --api-key
      - ${LLM_API_KEY:-local-token}
      - --dtype
      - auto
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION:-0.68}
      - --max-model-len
      - ${LLM_MAX_MODEL_LEN:-4096}
      - --generation-config
      - vllm
    volumes:
      - ${MODEL_CACHE_DIR:-/opt/models}/huggingface:/root/.cache/huggingface

  supervisor:
    image: vllm/vllm-openai:latest
    profiles: ["supervisor"]
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${SUPERVISOR_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - --host
      - 127.0.0.1
      - --port
      - ${SUPERVISOR_PORT:-8001}
      - --api-key
      - ${SUPERVISOR_API_KEY:-local-token}
      - --dtype
      - auto
      - --gpu-memory-utilization
      - ${SUPERVISOR_GPU_MEMORY_UTILIZATION:-0.16}
      - --max-model-len
      - ${SUPERVISOR_MAX_MODEL_LEN:-2048}
      - --generation-config
      - vllm
    volumes:
      - ${MODEL_CACHE_DIR:-/opt/models}/huggingface:/root/.cache/huggingface

  agent:
    gpus: all
    depends_on:
      - llm
    environment:
      STT_DEVICE: cuda
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-medium}
      STT_COMPUTE_TYPE_GPU: ${STT_COMPUTE_TYPE_GPU:-float16}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-3}
      STT_CONFIDENCE_FLOOR: ${STT_CONFIDENCE_FLOOR:-0.25}
      DEBUG_SAVE_WAV: ${DEBUG_SAVE_WAV:-false}
